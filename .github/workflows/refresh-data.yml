name: Refresh railway data

on:
  schedule:
    # 07:17 Asia/Shanghai, away from the top of the hour.
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Allow enough time for a direct cross-border TCP connection.
      NODE_OPTIONS: --dns-result-order=ipv4first --network-family-autoselection-attempt-timeout=3000
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      needs_continue: ${{ steps.refresh.outputs.needs_continue }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore raw data cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: data/raw
          key: railway-raw-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: railway-raw-v1-
      - name: Bootstrap missing raw data
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/raw/osm/meta.json ] || [ ! -f data/raw/12306/stations.json ]; then
            mkdir -p "$RUNNER_TEMP/railway-bootstrap" data
            gh release download data-bootstrap-v1 --pattern railway-raw-seed.tar.gz --dir "$RUNNER_TEMP/railway-bootstrap"
            node scripts/tools/verify-bootstrap.mjs "$RUNNER_TEMP/railway-bootstrap/railway-raw-seed.tar.gz"
            tar -xzf "$RUNNER_TEMP/railway-bootstrap/railway-raw-seed.tar.gz" -C data
          fi
      - name: Test rolling window and cache behavior
        run: npm run test:window
      - name: Check direct access to 12306
        run: node --no-use-env-proxy scripts/tools/probe-12306.mjs
      - name: Fill one day and retry missing timetables
        id: refresh
        timeout-minutes: 150
        run: node scripts/refresh-window.mjs --days 15 --interval 5000 --timetable-batch 300
      - name: Prune old lists once the window is complete
        if: steps.refresh.outputs.covered == '15'
        run: node scripts/tools/prune-12306.mjs --start ${{ steps.refresh.outputs.window_start }} --days 15 --keep-timetables
      - name: Save cache and partial progress
        if: ${{ always() && !cancelled() && steps.bootstrap.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: data/raw
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Commit validated snapshot
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh railway data $(TZ=Asia/Shanghai date +%F)"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}

  continue-backfill:
    needs: [refresh, deploy]
    if: needs.refresh.outputs.needs_continue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Rest between batches
        run: sleep 600
      - name: Start the next small batch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run refresh-data.yml --ref main
